name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "ghostnet_app/pubspec.yaml" ]; then
            cd ghostnet_app && flutter pub get
          elif [ -f "ghostnet-app_app/pubspec.yaml" ]; then
            cd ghostnet-app_app && flutter pub get
          else
            echo "pubspec.yaml не найден!"
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --release
          elif [ -f "ghostnet_app/pubspec.yaml" ]; then
            cd ghostnet_app && flutter build apk --release
          elif [ -f "ghostnet-app_app/pubspec.yaml" ]; then
            cd ghostnet-app_app && flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostnet-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            ghostnet_app/build/app/outputs/flutter-apk/app-release.apk
            ghostnet-app_app/build/app/outputs/flutter-apk/app-release.apk
